<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Spatial DSS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #0e1418;
    --panel: #141b21;
    --panel-2: #1a232b;
    --line: #253038;
    --text: #dce4e9;
    --text-dim: #7c8993;
    --accent: #4fb0a5;
    --accent-dim: #2f6b64;
    --ok: #4caf6d;
    --warn: #d9a441;
    --bad: #d9605a;
    --mono: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100vh;
    overflow: hidden;
  }

  #app {
    display: grid;
    grid-template-columns: 420px 1fr;
    grid-template-rows: 56px 1fr;
    grid-template-areas:
      "header header"
      "panel  map";
    height: 100vh;
  }

  header {
    grid-area: header;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
  }

  header .brand {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--accent);
    text-transform: uppercase;
  }

  header .brand-sub {
    font-size: 11px;
    color: var(--text-dim);
  }

  #panel {
    grid-area: panel;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #query-form {
    padding: 16px;
    border-bottom: 1px solid var(--line);
  }

  #query-input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 13.5px;
    font-family: var(--sans);
    resize: none;
  }
  #query-input:focus {
    outline: none;
    border-color: var(--accent-dim);
  }

  #query-form button {
    margin-top: 8px;
    width: 100%;
    background: var(--accent-dim);
    color: #eafaf7;
    border: none;
    border-radius: 6px;
    padding: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  #query-form button:hover { background: var(--accent); color: #08201c; }
  #query-form button:disabled { opacity: 0.5; cursor: default; }

  .example-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .chip {
    font-size: 11px;
    color: var(--text-dim);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 9px;
    cursor: pointer;
    font-family: var(--mono);
  }
  .chip:hover { border-color: var(--accent-dim); color: var(--accent); }

  #results {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  .parsed-block {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-dim);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 14px;
    line-height: 1.6;
  }
  .parsed-block .intent {
    color: var(--accent);
    font-weight: 600;
  }
  .warning-banner {
    background: #2a2013;
    border: 1px solid var(--warn);
    color: var(--warn);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    margin-bottom: 14px;
  }

  .result-card {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .result-card .asset-id {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    font-weight: 600;
  }
  .score-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
  }
  .score-bar-track {
    flex: 1;
    height: 6px;
    background: var(--bg);
    border-radius: 3px;
    overflow: hidden;
  }
  .score-bar-fill { height: 100%; border-radius: 3px; }
  .score-label { font-family: var(--mono); font-size: 12px; min-width: 38px; text-align: right; }

  .summary-sentence {
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    border-left: 2px solid var(--accent-dim);
    padding: 6px 10px;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  .contrib-list { margin-top: 8px; font-size: 11.5px; }
  .contrib-row {
    display: flex;
    justify-content: space-between;
    padding: 2px 0;
    color: var(--text-dim);
  }
  .contrib-row span:last-child { font-family: var(--mono); }
  .contrib-pos { color: var(--ok); }
  .contrib-neg { color: var(--bad); }

  .os-rank-item {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 3px 0;
    border-bottom: 1px solid var(--line);
  }
  .os-rank-item:last-child { border-bottom: none; }
  .os-rank-item .name { color: var(--text); }
  .os-rank-item .score { font-family: var(--mono); color: var(--text-dim); }

  #empty-state {
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    margin-top: 60px;
    line-height: 1.7;
    padding: 0 20px;
  }
  #empty-state .big { font-size: 28px; margin-bottom: 8px; }

  #map { grid-area: map; }

  .leaflet-popup-content-wrapper {
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
  }
  .leaflet-popup-tip { background: var(--panel); }
  .popup-title { font-weight: 600; margin-bottom: 4px; }
  .popup-row { font-size: 12px; color: var(--text-dim); }

  .legend {
    position: absolute;
    bottom: 24px;
    left: 24px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 11.5px;
    color: var(--text-dim);
    z-index: 500;
  }
  .legend-item { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="brand">Campus Spatial DSS</div>
      <div class="brand-sub">GIS + NLP + XAI hardware & software compatibility</div>
    </div>
  </header>

  <div id="panel">
    <form id="query-form">
      <textarea id="query-input" rows="2" placeholder="Ask about compatibility, e.g. &quot;Which computers in Block C can't run Windows 11?&quot;"></textarea>
      <button type="submit" id="query-btn">Run query</button>
      <div class="example-chips">
        <div class="chip" data-q="Which computers in Block C can't run Windows 11?">Windows 11 in Block C</div>
        <div class="chip" data-q="Recommend the best OS for the Research Lab">Recommend OS for Research Lab</div>
        <div class="chip" data-q="Which systems in the CAD Lab can run AutoCAD?">AutoCAD in CAD Lab</div>
      </div>
    </form>
    <div id="results">
      <div id="empty-state">
        <div class="big">&#8981;</div>
        Type a question above, or click the map markers directly to inspect individual machines.
      </div>
    </div>
  </div>

  <div id="map"></div>
</div>

<script>
const API_BASE = "http://localhost:8000";

const map = L.map('map', { zoomControl: false }).setView([11.14, 79.486], 17);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  maxZoom: 20,
}).addTo(map);

const legend = L.control({ position: 'bottomleft' });
legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <div class="legend-item"><span class="legend-dot" style="background:#4fb0a5"></span>Location marker</div>
    <div class="legend-item"><span class="legend-dot" style="background:#4caf6d"></span>High compatibility</div>
    <div class="legend-item"><span class="legend-dot" style="background:#d9a441"></span>Partial compatibility</div>
    <div class="legend-item"><span class="legend-dot" style="background:#d9605a"></span>Low compatibility</div>
  `;
  return div;
};
legend.addTo(map);

let locationMarkers = {};

async function loadLocations() {
  try {
    const res = await fetch(`${API_BASE}/locations`);
    const locations = await res.json();
    const bounds = [];
    locations.forEach(loc => {
      const marker = L.circleMarker([loc.latitude, loc.longitude], {
        radius: 8,
        fillColor: '#4fb0a5',
        color: '#0e1418',
        weight: 2,
        fillOpacity: 0.9,
      }).addTo(map);
      marker.bindPopup(`
        <div class="popup-title">${loc.lab} &middot; ${loc.block}</div>
        <div class="popup-row">${loc.asset_count} machines</div>
      `);
      locationMarkers[loc.location_id] = marker;
      bounds.push([loc.latitude, loc.longitude]);
    });
    if (bounds.length) map.fitBounds(bounds, { padding: [60, 60] });
  } catch (e) {
    console.error("Could not load locations -- is the API running at " + API_BASE + "?", e);
  }
}
loadLocations();

function scoreColor(pct) {
  if (pct >= 70) return 'var(--ok)';
  if (pct >= 35) return 'var(--warn)';
  return 'var(--bad)';
}

function renderParsedQuery(parsed) {
  let html = `<div class="parsed-block">
    intent: <span class="intent">${parsed.intent}</span> (${(parsed.intent_confidence*100).toFixed(1)}% confidence)<br>
    location: ${parsed.location ?? '—'} &nbsp; target_os: ${parsed.target_os ?? '—'} &nbsp; software: ${parsed.software ?? '—'}
  </div>`;
  if (parsed.warning) {
    html += `<div class="warning-banner">${parsed.warning}</div>`;
  }
  return html;
}

function renderExplanation(exp) {
  if (!exp) return '';
  const rows = Object.entries(exp.feature_contributions_pct)
    .map(([k, v]) => `<div class="contrib-row"><span>${k}</span><span class="${v >= 0 ? 'contrib-pos' : 'contrib-neg'}">${v >= 0 ? '+' : ''}${v}%</span></div>`)
    .join('');
  const summary = exp.summary_sentence
    ? `<div class="summary-sentence">${exp.summary_sentence}</div>`
    : '';
  return `
    ${summary}
    <div class="score-row">
      <div class="score-bar-track"><div class="score-bar-fill" style="width:${exp.compatibility_score_pct}%; background:${scoreColor(exp.compatibility_score_pct)}"></div></div>
      <div class="score-label">${exp.compatibility_score_pct}%</div>
    </div>
    <div class="contrib-list">${rows}</div>
  `;
}

function renderOsRanking(topOs) {
  return topOs.map(o => `
    <div class="os-rank-item">
      <span class="name">#${o.rank} ${o.os_name}</span>
      <span class="score">${(o.suitability_score * 100).toFixed(0)}%</span>
    </div>
  `).join('');
}

function renderResults(data) {
  const resultsEl = document.getElementById('results');
  let html = renderParsedQuery(data.parsed_query);

  if (data.compatibility_results) {
    html += data.compatibility_results.slice(0, 25).map(r => `
      <div class="result-card">
        <div class="asset-id">${r.asset_id} &rarr; ${r.os_name}</div>
        ${renderExplanation(r.explanation)}
      </div>
    `).join('');
    if (data.compatibility_results.length > 25) {
      html += `<div style="text-align:center; color:var(--text-dim); font-size:12px; padding:8px;">
        + ${data.compatibility_results.length - 25} more machines not shown</div>`;
    }
  } else if (data.recommendations) {
    html += data.recommendations.slice(0, 25).map(r => `
      <div class="result-card">
        <div class="asset-id">${r.asset_id}</div>
        ${renderOsRanking(r.top_3_os)}
      </div>
    `).join('');
  } else if (data.matched_assets) {
    html += `<div class="result-card">Matched ${data.matched_asset_count} assets: ${data.matched_assets.slice(0, 20).join(', ')}${data.matched_assets.length > 20 ? '…' : ''}</div>`;
  } else if (data.software_requirements) {
    const sw = data.software_requirements;
    html += `<div class="result-card">
      <div class="asset-id">${data.parsed_query.software}</div>
      <div class="popup-row">Min RAM: ${sw.min_ram_gb}GB &nbsp; Min Storage: ${sw.min_storage_gb}GB</div>
      <div class="popup-row">Supported OS: ${sw.supported_os}</div>
    </div>`;
  } else {
    html += `<div style="color:var(--text-dim); font-size:12.5px;">No specific routing logic for this intent yet -- see Phase 6 (software Tier 2) for extending this.</div>`;
  }

  resultsEl.innerHTML = html;
}

document.getElementById('query-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = document.getElementById('query-input').value.trim();
  if (!text) return;

  const btn = document.getElementById('query-btn');
  btn.disabled = true;
  btn.textContent = 'Running…';
  document.getElementById('results').innerHTML = `<div id="empty-state">Querying…</div>`;

  try {
    const res = await fetch(`${API_BASE}/query?text=${encodeURIComponent(text)}`, { method: 'POST' });
    if (!res.ok) throw new Error(`API returned ${res.status}`);
    const data = await res.json();
    renderResults(data);
  } catch (err) {
    document.getElementById('results').innerHTML = `
      <div class="warning-banner">
        Could not reach the API at ${API_BASE}. Make sure your FastAPI server
        is running (uvicorn main:app --reload) and that CORS is enabled.
        <br><br>Error: ${err.message}
      </div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Run query';
  }
});

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.getElementById('query-input').value = chip.dataset.q;
    document.getElementById('query-form').dispatchEvent(new Event('submit'));
  });
});
</script>
</body>
</html>
